{{ define "main" }}
<article>
    <header id="post-header">
        <h1>{{ .Title }}</h1>
    </header>
    <ul>
        <li><strong>Build time:</strong> {{ now.Format "2006-01-02 15:04:05 MST" }}</li>
        <li><strong>Hugo version:</strong> {{ hugo.Version }}</li>
    </ul>
    {{ .Content }}
</article>
{{ end }}
